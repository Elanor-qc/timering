<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时环</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="nav">
      <button id="prevDay" class="ghost icon" title="前一天">‹</button>
      <div id="dateLabel" class="date"></div>
      <button id="nextDay" class="ghost icon" title="后一天">›</button>
      <button id="todayBtn" class="ghost chip">今天</button>
    </div>
    <div class="tools">
      <button id="historyBtn" class="ghost chip">历史</button>
      <button id="settingsBtn" class="ghost icon" title="设置">⚙</button>
    </div>
  </header>

  <main id="dayView">
    <svg id="ring" viewBox="0 0 400 400"></svg>
    <button id="untilNowBtn" class="until-now" title="从上一段结束记到现在">＋ 记到现在</button>
    <div id="dragTip" class="drag-tip" hidden></div>
    <ul id="legend"></ul>
    <div id="emptyHint" class="empty-hint">单击空白处新建事件，也可沿环拖动 · 支持时间重叠</div>
  </main>

  <main id="historyView" hidden>
    <div class="history-head">
      <button id="historyBack" class="ghost chip">‹ 返回</button>
      <span class="history-title">历史</span>
    </div>
    <div id="historyList"></div>
  </main>
</div>

<div id="popOverlay" class="overlay" hidden></div>
<div id="popover" class="popover" hidden>
  <div class="pop-title" id="popTitle">记录这段时间</div>
  <label class="pop-row"><span>标签</span>
    <input id="popLabel" type="text" placeholder="这段时间在做什么？" autocomplete="off">
  </label>
  <label class="pop-row"><span>从</span><input id="popStart" type="time" step="300"></label>
  <label class="pop-row"><span>到</span><input id="popEnd" type="time" step="300"></label>
  <div class="pop-actions">
    <button id="popDelete" class="ghost danger" hidden>删除</button>
    <span class="spacer"></span>
    <button id="popCancel" class="ghost">取消</button>
    <button id="popSave" class="primary">保存</button>
  </div>
  <div class="pop-hint">Enter 保存 · Esc 取消</div>
</div>

<div id="settingsOverlay" class="overlay" hidden></div>
<div id="settingsPop" class="popover settings" hidden>
  <div class="pop-title">设置</div>
  <div id="nativeOnly" class="settings-note" hidden>
    （当前为浏览器预览模式，以下系统功能不可用）
  </div>
  <label class="pop-row switch">
    <span>开机自启</span>
    <input type="checkbox" id="setAutostart">
  </label>
  <label class="pop-row switch">
    <span>全局快捷键 Ctrl+Alt+T<br><small>呼出 / 隐藏记录环</small></span>
    <input type="checkbox" id="setHotkey">
  </label>
  <div class="pop-row dir-row">
    <span>数据目录</span>
    <div class="dir">
      <div id="dataDirLabel" class="dir-path">–</div>
      <button id="openDirOpen" class="ghost chip" onclick="openDataDir()">打开</button>
    </div>
  </div>
  <div class="pop-hint">每天一个 JSON 文件，人类可读，可直接备份</div>
  <div class="pop-actions">
    <span class="spacer"></span>
    <button id="settingsClose" class="primary">关闭</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/js/neutralino.js/neutralino.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
